<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtle Inner Border -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Shopping Bag Handles -->
  <path d="M192 190 C192 120, 320 120, 320 190" fill="none" stroke="url(#accent-grad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Shopping Bag Body -->
  <path d="M128 180 L384 180 L412 400 C414 416, 400 430, 384 430 L128 430 C112 430, 98 416, 100 400 Z" fill="#ffffff" fill-opacity="0.95" filter="url(#glow)"/>

  <!-- Decorative Bag Fold / Flap -->
  <path d="M128 180 L180 260 L332 260 L384 180 Z" fill="url(#bg-grad)" fill-opacity="0.12"/>

  <!-- Emblem / Star Sparkle on Bag -->
  <path d="M256 270 L268 308 L306 320 L268 332 L256 370 L244 332 L206 320 L244 308 Z" fill="url(#gold-grad)"/>

  <!-- Small Corner Sparkle -->
  <circle cx="340" cy="230" r="10" fill="url(#accent-grad)"/>
</svg>
